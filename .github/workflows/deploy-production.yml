name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA from main to deploy or roll back to
        required: false
        type: string
      rebuild:
        description: Re-run quality gates and rebuild the image instead of deploying the existing SHA image
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/asmoorr/cv

jobs:
  prepare:
    name: Select immutable revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate revision from main
        id: revision
        env:
          REQUESTED_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse --verify "${REQUESTED_SHA}^{commit}")"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The selected revision is not a full Git commit SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "The selected revision is not part of main." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gates
    needs: prepare
    if: github.event_name == 'push' || inputs.rebuild
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://artem-trikula.ru
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test deployment entrypoint
        run: sudo bash ops/tests/deploy-entrypoint.test.sh

      - name: Build production application
        run: npm run build

  publish:
    name: Ensure immutable image exists
    needs: [prepare, quality]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out selected revision
        if: github.event_name == 'push' || inputs.rebuild
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || inputs.rebuild
        uses: docker/setup-buildx-action@v4

      - name: Build and publish commit image
        if: github.event_name == 'push' || inputs.rebuild
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/asmoorr/cv:${{ needs.prepare.outputs.sha }}
          build-args: SITE_URL=https://artem-trikula.ru
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify existing image for deployment or rollback
        if: github.event_name == 'workflow_dispatch' && !inputs.rebuild
        run: docker buildx imagetools inspect "ghcr.io/asmoorr/cv:${{ needs.prepare.outputs.sha }}"

  deploy:
    name: Deploy to artem-trikula.ru
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://artem-trikula.ru
    concurrency:
      group: artem-trikula-production
      cancel-in-progress: false
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy selected SHA
        id: remote_deploy
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_PORT: ${{ vars.PRODUCTION_PORT || '22' }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER || 'deploy' }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -- /usr/local/sbin/deploy-artem-trikula '$DEPLOY_SHA'"

      - name: Write deployment summary
        if: always()
        env:
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
          DEPLOY_RESULT: ${{ steps.remote_deploy.outcome }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Endpoint: https://artem-trikula.ru"
            echo "- Result: \`$DEPLOY_RESULT\`"
            if [[ "$DEPLOY_RESULT" != "success" ]]; then
              echo "- Rollback: the server entrypoint attempted automatic rollback; inspect the deploy step for its result."
            else
              echo "- Rollback: not required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
